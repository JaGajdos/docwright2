<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>DocWiright — README + architecture diagram generátor</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mermaid/11.4.0/mermaid.min.js"></script>
<style>
  :root {
    --bg: #0f1117;
    --panel: #171a23;
    --border: #2a2e3a;
    --text: #e6e8ee;
    --muted: #9aa0ac;
    --accent: #6ea8fe;
    --error: #ff6b6b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  .wrap { max-width: 860px; margin: 0 auto; padding: 40px 20px 80px; }
  h1 { font-size: 1.6rem; margin-bottom: 4px; }
  p.sub { color: var(--muted); margin-top: 0; }
  form {
    display: flex; gap: 8px; flex-wrap: wrap;
    background: var(--panel); border: 1px solid var(--border);
    padding: 16px; border-radius: 10px; margin: 24px 0;
  }
  input[type="text"] {
    flex: 1 1 280px; padding: 10px 12px; border-radius: 8px;
    border: 1px solid var(--border); background: #10121a; color: var(--text);
    font-size: 0.95rem;
  }
  select {
    padding: 10px 12px; border-radius: 8px; border: 1px solid var(--border);
    background: #10121a; color: var(--text);
  }
  button {
    padding: 10px 18px; border-radius: 8px; border: none;
    background: var(--accent); color: #0b0d12; font-weight: 600; cursor: pointer;
  }
  button:disabled { opacity: 0.6; cursor: not-allowed; }
  #status { color: var(--muted); min-height: 1.2em; margin-bottom: 12px; }
  #status.error { color: var(--error); }
  .result-panel {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 10px; padding: 20px 24px; margin-bottom: 20px;
  }
  .result-panel h2 { margin-top: 0; font-size: 1.1rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; }
  .meta { font-size: 0.85rem; color: var(--muted); margin-bottom: 16px; }
  #readmeOut { line-height: 1.55; }
  #readmeOut pre { background: #10121a; padding: 12px; border-radius: 8px; overflow-x: auto; }
  #readmeOut code { background: #10121a; padding: 2px 5px; border-radius: 4px; }
  #diagramOut { text-align: center; overflow-x: auto; }
  footer { color: var(--muted); font-size: 0.8rem; margin-top: 40px; text-align: center; }
  a { color: var(--accent); }
</style>
</head>
<body>
<div class="wrap">
  <h1>DocWiright</h1>
  <p class="sub">Vygeneruje README a one-screen architecture diagram pre verejný GitHub repozitár.</p>

  <form id="genForm">
    <input type="text" id="repoInput" placeholder="napr. sindresorhus/is-stream alebo https://github.com/owner/repo" required />
    <select id="templateSelect">
      <option value="">auto-detekcia</option>
      <option value="library">library</option>
      <option value="cli">cli</option>
      <option value="app">app</option>
      <option value="api">api</option>
    </select>
    <button type="submit" id="submitBtn">Generuj</button>
  </form>

  <div id="status"></div>

  <div id="results" style="display:none;">
    <div class="result-panel">
      <h2>Súhrn</h2>
      <div class="meta" id="metaOut"></div>
      <div id="summaryOut"></div>
    </div>
    <div class="result-panel">
      <h2>Architecture diagram</h2>
      <div id="diagramOut"></div>
    </div>
    <div class="result-panel">
      <h2>README</h2>
      <div id="readmeOut"></div>
    </div>
  </div>

  <footer>
    DocWiright beží na Node.js + GitHub MCP + Azure OpenAI (GPT-5.6 Terra). Zdrojový kód:
    <a href="https://github.com/JaGajdos/docwright2" target="_blank" rel="noopener">docwright2</a>.
  </footer>
</div>

<script>
  // Nastav na skutočnú verejnú URL backendu po nasadení na Railway
  // (Railway dashboard -> Service -> Settings -> Networking -> Public Networking -> generovaná doména).
  const API_BASE_URL = "https://docwright2-production.up.railway.app";

  mermaid.initialize({ startOnLoad: false, theme: "dark" });

  const form = document.getElementById("genForm");
  const statusEl = document.getElementById("status");
  const resultsEl = document.getElementById("results");
  const submitBtn = document.getElementById("submitBtn");

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const repo = document.getElementById("repoInput").value.trim();
    const template = document.getElementById("templateSelect").value;
    if (!repo) return;

    if (API_BASE_URL.includes("REPLACE_WITH_YOUR_RAILWAY_URL")) {
      statusEl.textContent = "Backend URL ešte nie je nastavená (API_BASE_URL v docs/index.html). Nastav ju na svoju Railway doménu.";
      statusEl.className = "error";
      return;
    }

    submitBtn.disabled = true;
    resultsEl.style.display = "none";
    statusEl.className = "";
    statusEl.textContent = "Generujem... (zvyčajne 10-90 sekúnd, prvý request po dlhšej neaktivite môže trvať dlhšie kvôli cold-startu backendu)";

    try {
      const res = await fetch(`${API_BASE_URL}/api/generate`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ repo, template: template || undefined }),
      });
      const data = await res.json();

      if (!res.ok) {
        statusEl.className = "error";
        statusEl.textContent = `Chyba [${data.error_code ?? res.status}]: ${data.message ?? "neznáma chyba"}`;
        return;
      }

      statusEl.textContent = "Hotovo.";
      document.getElementById("metaOut").textContent =
        `${data.repository} · šablóna: ${data.template} (${data.template_source}) · model: ${data.model_id}` +
        (data.mermaid_repaired ? " · diagram bol automaticky opravený" : "");
      document.getElementById("summaryOut").textContent = data.summary;
      document.getElementById("readmeOut").innerHTML = marked.parse(data.readme_markdown);

      const diagramEl = document.getElementById("diagramOut");
      diagramEl.innerHTML = "";
      const { svg } = await mermaid.render("architectureDiagram", data.architecture_diagram);
      diagramEl.innerHTML = svg;

      resultsEl.style.display = "block";
    } catch (err) {
      statusEl.className = "error";
      statusEl.textContent = `Sieťová chyba: ${err.message}. Skontroluj, či backend beží a API_BASE_URL je správna.`;
    } finally {
      submitBtn.disabled = false;
    }
  });
</script>
</body>
</html>
